name: CI

# Vérifie chaque push et chaque pull request : tests Rust sur Linux et macOS (Intel : pas de runner Apple Silicon),
# compilation Windows, tests de l'interface (Node), syntaxe des scripts d'installation et de build.
on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --lib
      - run: cargo build --release --bins

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins

  # Le projet reste compilable avec Rust 1.75 (versions des dépendances épinglées dans Cargo.toml).
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo check --locked --lib --bins

  # Vrai binaire + Firefox headless : erreurs JavaScript, thème, fond animé, Discord, menu mobile, double authentification.
  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: browser-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --bins
      - run: pip install selenium
      - run: python3 scripts/browser-test.py --binary target/debug/mcmanager --server target/debug/mcmanager-server --firefox "$(which firefox)" --geckodriver "$(which geckodriver)"

  # Vrais processus : deux instances jumelées, transferts par le tunnel chiffré, HTTPS, migration d'anciennes données,
  # reprise des serveurs après redémarrage et arrêt propre (scripts/two-process-test.py).
  processes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: processes-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --bins
      - run: python3 scripts/two-process-test.py --server target/debug/mcmanager-server --desktop target/debug/mcmanager

  # Image Docker : démarrage, santé, connexion, persistance, arrêt propre. Longue (construction) : à la demande,
  # chaque semaine et sur les étiquettes de version, pas à chaque push.
  docker:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - run: scripts/docker-test.sh

  ui-and-scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in web/*.js; do node --check "$f"; done
      - run: node scripts/test-ui.js
      - run: bash -n build.sh && bash -n scripts/install.sh && bash -n scripts/make-macos-app.sh && bash -n scripts/docker-test.sh
      - run: python3 -m py_compile scripts/two-process-test.py scripts/browser-test.py scripts/make-site-shots.py
      - run: diff scripts/install.sh website/install.sh && diff scripts/install.ps1 website/install.ps1
