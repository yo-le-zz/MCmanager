name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Required for softprops/action-gh-release to create/update a GitHub Release
# with the default GITHUB_TOKEN. Without this, the publish job fails with
# "403 Resource not accessible by integration" even though the workflow
# otherwise runs fine - the token defaults to read-only content access on
# repos where that's the org/repo setting.
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      # NOTE: `build.sh installer` (the Windows Inno Setup step) is NOT run
      # here - Inno Setup only exists on Windows, so ISCC.exe is never
      # available on this ubuntu-latest runner and the .exe was silently
      # never produced. That step now runs in the windows job below, where
      # the compiled .exe files it needs to package actually exist.
      - run: chmod +x build.sh && ./build.sh linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/install-linux.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # --bins: build every [[bin]] target (mcmanager + mcmanager-headless),
      # not just the default one. A plain `cargo build --release` happens to
      # also build both here since there's no workspace default-members
      # override, but being explicit keeps this in sync with build.sh's
      # Linux/Windows steps instead of silently diverging if that ever
      # changes.
      - run: cargo build --release --bins
      - run: |
          mkdir dist
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $out = "dist/mcmanager-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $out
          Copy-Item target/release/mcmanager.exe $out/
          Copy-Item target/release/mcmanager-headless.exe $out/
          Copy-Item -Recurse web $out/web
          Copy-Item README.md,LICENSE,CHANGELOG.md $out/
          Compress-Archive -Path $out -DestinationPath "dist/mcmanager-$ver-windows-x86_64.zip"
        shell: pwsh
      # Produces dist/mcmanager-<version>-setup.exe. Needs the two binaries
      # already built above (build.sh's install script embeds them via the
      # generated .iss [Files] section, matching the folder just created).
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh
      - name: Add Inno Setup to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - name: Build Windows installer (.exe)
        run: bash build.sh installer
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            dist/*.zip
            dist/*.exe

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v27
      - run: nix build .#default
      - run: mkdir -p dist && tar czf dist/mcmanager-nix-x86_64-linux.tar.gz -C result .
      - uses: actions/upload-artifact@v7
        with:
          name: nix-artifacts
          path: dist/*.tar.gz

  publish:
    needs: [linux, windows, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
