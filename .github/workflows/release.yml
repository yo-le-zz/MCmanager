name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Required for softprops/action-gh-release to create/update a GitHub Release
# with the default GITHUB_TOKEN. Without this, the publish job fails with
# "403 Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Linux
  # Chaque architecture est compilee NATIVEMENT sur son propre runner
  # (aucune cross-compilation : meme resultat que sur la machine cible).
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            task: linux
          - arch: aarch64
            runner: ubuntu-24.04-arm   # Raspberry Pi 4/5, serveurs et VPS ARM64
            task: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # dpkg-dev -> .deb ; rpm -> .rpm (Fedora, RHEL/Rocky/Alma, openSUSE) : memes binaires, memes fichiers.
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm
      # Sur le runner ARM la compilation est native (build.sh ne cross-compile
      # que lorsque le CPU de la machine differe de la cible).
      - run: chmod +x build.sh && ./build.sh ${{ matrix.task }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-artifacts
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  # -------------------------------------------------------------- Windows
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm     # Windows sur ARM (Surface, PC Copilot+)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # --bins: build every [[bin]] target (mcmanager + mcmanager-server).
      - run: cargo build --release --bins
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $out = "dist/mcmanager-$ver-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/mcmanager.exe $out/
          Copy-Item target/release/mcmanager-server.exe $out/
          Copy-Item -Recurse web $out/web
          Copy-Item README.md,LICENSE,CHANGELOG.md $out/
          Compress-Archive -Path $out -DestinationPath "dist/mcmanager-$ver-windows-${{ matrix.arch }}.zip"
      # Installateur .exe (Suivant > Suivant > Installer), un par architecture.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Add Inno Setup to PATH
        shell: pwsh
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows installer (.exe)
        shell: bash
        run: bash build.sh installer
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-artifacts
          path: |
            dist/*.zip
            dist/mcmanager-*-setup.exe

  # --------------------------------------------------------------- Docker
  # Image multi-architecture (amd64 + arm64) : `docker pull` choisit seul.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"   # pas d'artefact de trace .dockerbuild
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcmanager:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/mcmanager:latest

  # -------------------------------------------------------------- Publish
  publish:
    needs: [linux, windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # Uniquement nos artefacts : docker/build-push-action en depose aussi un de
      # trace (*.dockerbuild) que download-artifact ne sait pas extraire, ce qui
      # faisait echouer toute la publication apres 5 essais.
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-artifacts"
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
