[package]
name = "mcmanager"
version = "1.0.0"
edition = "2021"
authors = ["yolezz"]
license = "MIT"
description = "MCManager - Minecraft server manager (web backend + web UI)"
repository = "https://github.com/yolezz/mcmanager"

[[bin]]
name = "mcmanager"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sysinfo = "0.30"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2"

chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
rand = "0.8"
sha2 = "0.10"

# Pins to stay compatible with the Rust toolchain available in this build
# environment (1.75). Newer releases of these transitive deps require
# edition2024 / a newer MSRV. Safe to relax once building with Rust >= 1.82.
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
url = "=2.5.0"
idna = "=0.5.0"
litemap = "=0.7.3"
zerofrom = "=0.1.5"
getrandom = "=0.2.15"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
rayon = "=1.10.0"
rayon-core = "=1.12.1"



[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
